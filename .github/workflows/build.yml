name: Build Legend Cut

# كل ما يتغير رقم VERSION داخل legend_cut.py وينرفع، ينبني ملف التنصيب وينزل كـ Release جديد تلقائياً
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        shell: pwsh
        run: |
          $v = (Select-String -Path legend_cut.py -Pattern 'VERSION = "([\d.]+)"').Matches[0].Groups[1].Value
          "VER=$v" >> $env:GITHUB_ENV
          gh release view "v$v" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { "SKIP=1" >> $env:GITHUB_ENV; Write-Host "v$v already released - skipping" } else { "SKIP=0" >> $env:GITHUB_ENV }
          exit 0

      - uses: actions/setup-python@v5
        if: env.SKIP == '0'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: env.SKIP == '0'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build app
        if: env.SKIP == '0'
        run: >
          pyinstaller --noconfirm --windowed --name LegendCut
          --icon assets/icon.ico --add-data "assets;assets"
          --collect-all faster_whisper --collect-all ctranslate2 --collect-all onnxruntime
          --collect-all av --collect-all tokenizers --collect-all tkinterdnd2 --collect-all imageio_ffmpeg
          legend_cut.py

      - name: Smoke test (the exe starts and its engine works)
        if: env.SKIP == '0'
        shell: pwsh
        run: |
          $p = Start-Process dist\LegendCut\LegendCut.exe -ArgumentList "--selftest" -PassThru -Wait
          $log = "$env:USERPROFILE\.legend_cut\selftest.log"
          $c = if (Test-Path $log) { Get-Content $log -Raw } else { "NO LOG FILE - exe exited with $($p.ExitCode) before the self-test ran" }
          Write-Host $c
          if ($p.ExitCode -ne 0) { ($c -split "`n") | Where-Object { $_.Trim() } | Select-Object -Last 15 | ForEach-Object { Write-Host "::error::$_" }; exit 1 }

      - name: Build installer
        if: env.SKIP == '0'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $env:APP_VERSION = $env:VER
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Publish release
        if: env.SKIP == '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: Legend Cut v${{ env.VER }}
          target_commitish: ${{ github.sha }}
          files: dist/LegendCut-Setup.exe
          generate_release_notes: true
